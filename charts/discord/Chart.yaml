apiVersion: v2
name: discord
description: Umbrella chart deploying the full Clan Europe Discord stack (bot + event + pocketbase)
type: application
version: 0.1.0
appVersion: "main"
dependencies:
  - name: bot
    version: "0.1.0"
    repository: "file://../bot"
    condition: bot.enabled
  - name: event
    version: "0.1.0"
    repository: "file://../event"
    condition: event.enabled
  - name: pocketbase
    version: "0.1.0"
    repository: "file://../pocketbase"
    condition: pocketbase.enabled
