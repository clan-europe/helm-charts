apiVersion: v2
name: go-bots
description: Umbrella chart deploying the full Clan Europe Golang Discord stack (bot + event + pocketbase)
type: application
version: 0.1.11
appVersion: "v0.4.0"
dependencies:
  - name: bot
    version: "0.1.11"
    repository: "file://../bot"
    condition: bot.enabled
  - name: event
    version: "0.1.11"
    repository: "file://../event"
    condition: event.enabled
  - name: pocketbase
    version: "0.1.11"
    repository: "file://../pocketbase"
    condition: pocketbase.enabled
